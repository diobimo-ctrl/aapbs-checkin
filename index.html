html { color-scheme:light; background:#f7f0e9; }
body {
  margin:0 !important;
  min-height:100vh;
  font-family:Inter,"Segoe UI",Arial,Helvetica,sans-serif !important;
  color:var(--aapbs-ink) !important;
  background:
    radial-gradient(ellipse at 8% 75%,rgba(103,37,58,.055),transparent 43%),
    radial-gradient(ellipse at 94% 35%,rgba(28,58,95,.07),transparent 46%),
    #f7f0e9 !important;
  position:relative;
  padding-bottom:30px;
}
body::before {
  content:"";
  pointer-events:none;
  position:absolute;
  inset:0 0 auto;
  height:350px;
  z-index:0;
  background:
    repeating-radial-gradient(circle at -8% -55%,transparent 0 19px,rgba(255,255,255,.055) 20px 21px,transparent 22px 41px),
    linear-gradient(118deg,#122844 0%,#202941 48%,#67263b 100%);
  clip-path:polygon(0 0,100% 0,100% 86%,85% 92%,65% 96%,42% 90%,20% 95%,0 86%);
}
body::after {
  content:"AAPBS 2026   •   BALI, INDONESIA";
  display:block;
  position:relative;
  z-index:1;
  margin:32px auto 0;
  text-align:center;
  color:#8e8990;
  font-size:11px;
  letter-spacing:.14em;
  font-weight:800;
}
.container {
  position:relative;
  z-index:1;
  width:min(100% - 32px,960px) !important;
  max-width:960px !important;
  margin:0 auto !important;
  padding:34px 0 0 !important;
  box-sizing:border-box;
}
.container::before {
  content:"OFFICIAL PARTICIPANT ACCESS   /   1–3 NOVEMBER 2026";
  display:block;
  margin:0 0 17px;
  color:rgba(255,255,255,.9);
  font-size:11px;
  line-height:1.5;
  letter-spacing:.18em;
  font-weight:900;
}
.container > .card, .container .card {
  position:relative;
  overflow:hidden;
  background:#fffdfb !important;
  border:1px solid rgba(234,216,205,.85);
  border-radius:28px !important;
  padding:0 40px 36px !important;
  box-shadow:0 24px 65px rgba(23,26,39,.14), 0 5px 14px rgba(62,28,43,.055) !important;
}
.card::before {
  content:"AAPBS\a ANNUAL MEETING 2026";
  white-space:pre;
  display:flex;
  align-items:center;
  box-sizing:border-box;
  width:calc(100% + 80px);
  min-height:95px;
  margin:0 -40px 33px;
  padding:23px 30px 22px 112px;
  background-color:#fff;
  background-image:var(--aapbs-logo);
  background-position:30px center;
  background-size:63px 63px;
  background-repeat:no-repeat;
  color:var(--aapbs-navy);
  font-size:20px;
  line-height:1.1;
  letter-spacing:-.02em;
  font-weight:900;
  border-bottom:1px solid #eaddd2;
  box-shadow:0 4px 20px rgba(36,29,42,.025);
}
.card > h1, .card h1 {
  text-align:left !important;
  font-size:clamp(30px,4.3vw,44px) !important;
  font-weight:850 !important;
  letter-spacing:-.045em;
  color:var(--aapbs-navy) !important;
  line-height:1.12 !important;
  margin:0 0 7px !important;
  max-width:710px;
}
.card > .subtitle, .card .subtitle {
  text-align:left !important;
  font-size:16px !important;
  color:#6b7484 !important;
  line-height:1.55 !important;
  margin:0 0 29px !important;
}
.card > label, .card label[for="scannerLocation"] {
  display:block;
  color:#182f4e !important;
  font-size:13px !important;
  font-weight:850 !important;
  letter-spacing:.045em;
  margin:0 0 2px;
}
.card label[for="scannerLocation"]::before {
  content:"01";
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:27px;
  min-width:27px;
  border-radius:9px;
  margin-right:11px;
  color:#fff;
  font-size:11px;
  background:var(--aapbs-maroon);
  box-shadow:0 4px 12px rgba(103,37,58,.19);
}
.card #scannerLocation {
  width:100% !important;
  max-width:100%;
  box-sizing:border-box;
  min-height:57px;
  margin:12px 0 11px !important;
  padding:14px 48px 14px 17px !important;
  border:1px solid #dfd6d2 !important;
  border-radius:14px !important;
  background-color:#fff !important;
  color:#182f4e !important;
  font-family:inherit;
  font-size:15px !important;
  font-weight:700;
  box-shadow:0 2px 6px rgba(30,29,36,.025);
  outline:none;
  cursor:pointer;
}
.card #scannerLocation:focus-visible,
.card #reader select:focus-visible,
.card #reader button:focus-visible,
.card button:focus-visible {
  border-color:#80435a !important;
  outline:3px solid rgba(128,67,90,.22) !important;
  outline-offset:2px;
}
.card #testBackendBtn {
  box-sizing:border-box;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:auto !important;
  max-width:100%;
  min-height:44px;
  padding:11px 19px !important;
  margin:1px 0 25px !important;
  border:1px solid #d5bfc1 !important;
  border-radius:999px !important;
  background:#fdf5f0 !important;
  color:#743449 !important;
  font-family:inherit;
  font-size:12px !important;
  font-weight:850 !important;
  box-shadow:none !important;
  transition:background .15s ease, transform .15s ease;
}
.card #testBackendBtn::before {
  content:"";
  display:inline-block;
  width:8px; height:8px;
  border-radius:50%;
  background:#789c76;
  box-shadow:0 0 0 4px rgba(120,156,118,.14);
}
.card #testBackendBtn:hover {background:#f7eae3 !important;transform:translateY(-1px);}
.card #reader {
  position:relative;
  box-sizing:border-box;
  display:block;
  width:100% !important;
  min-height:316px;
  margin:0 !important;
  padding:21px 18px 23px;
  border:1px solid #e5d9d0 !important;
  border-radius:20px;
  background:
    linear-gradient(90deg,var(--aapbs-maroon),var(--aapbs-navy)) left top/83px 3px no-repeat,
    linear-gradient(90deg,var(--aapbs-navy),var(--aapbs-maroon)) right bottom/83px 3px no-repeat,
    radial-gradient(circle at 50% 20%,rgba(103,37,58,.04),transparent 56%),
    #fbf8f5;
  box-shadow:inset 0 1px 5px rgba(42,28,35,.025);
  overflow:hidden;
  color:#243752;
}
.card #reader::before {
  content:"02  /  SCAN PARTICIPANT QR CODE";
  display:block;
  text-align:left;
  color:#803c52;
  font-size:11px;
  font-weight:900;
  letter-spacing:.14em;
  margin:0 0 16px;
}
.card #reader img {max-width:100%;height:auto;}
.card #reader video {
  display:block;
  margin:auto;
  max-width:100%;
  border-radius:13px;
}
.card #reader select,
.card #reader button {
  width:auto !important;
  max-width:100%;
  min-height:40px;
  margin:8px 4px 10px !important;
  padding:10px 14px !important;
  box-sizing:border-box;
  font-family:inherit;
  font-size:13px !important;
  font-weight:800;
  border-radius:11px !important;
  border:1px solid #d7cad0 !important;
  background:#fff !important;
  color:#203957 !important;
  cursor:pointer;
  vertical-align:middle;
}
.card #reader button:hover {background:#f5e9e5 !important;}
.card #reader #html5-qrcode-button-camera-start,
.card #reader #html5-qrcode-button-camera-permission,
.card #reader #html5-qrcode-button-camera-file-selection {
  background:var(--aapbs-maroon) !important;
  color:#fff !important;
  border-color:var(--aapbs-maroon) !important;
}
.card #reader a {color:#75364c !important;text-decoration:underline;font-weight:750;}
.card #reader__scan_region {border-radius:14px;overflow:hidden;}
.card #reader__dashboard {margin-top:14px;}
.card #reader__dashboard_section,
.card #reader__dashboard_section_csr,
.card #reader__dashboard_section_fsr {box-sizing:border-box;max-width:100%;}
.card #backendStatus,
.card #result {
  box-sizing:border-box;
  width:100%;
  padding:23px 23px !important;
  margin:20px 0 0 !important;
  border:1px solid transparent;
  border-radius:17px !important;
  box-shadow:0 8px 22px rgba(30,27,37,.045);
  line-height:1.65;
  text-align:left !important;
  overflow-wrap:anywhere;
  font-size:14px;
}
.card #backendStatus h2,
.card #result h2 {margin:0 0 7px;font-size:20px;color:inherit;}
.card #backendStatus h3,
.card #result h3 {margin:7px 0;font-size:22px;color:inherit;line-height:1.25;}
.card #result p,

      <option value="Main Entrance">
        Main Entrance
      </option>

        Registration Desk
      </option>

        Ballroom Entrance
      </option>

        Seminar Room
      </option>

<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzsN2SGpg8zm1Nl5HJ_-OB4k__m2uW60avtbs3cjYID_ZycgtzLSKgV3DQObFGJR2REyQ/exec";


let scanLocked = false;
let jsonpCounter = 0;


/*
========================================
JSONP REQUEST TO APPS SCRIPT
========================================
*/

function jsonpRequest(
  params,
  onSuccess,
  onError
) {

  jsonpCounter++;

  const callbackName =
    "aapbsCallback_" +
    Date.now() +
    "_" +
    jsonpCounter;

  const script =
    document.createElement("script");

  let finished = false;


  const timer =
    setTimeout(
      function() {

        if (finished) {
          return;
        }

        finished = true;

        try {
          delete window[callbackName];
        } catch (e) {}

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        onError(
          "Database tidak merespons. Silakan coba kembali."
        );

      },
      15000
    );


  window[callbackName] =
    function(response) {

      if (finished) {
        return;
      }

      finished = true;

      clearTimeout(timer);

      try {
        delete window[callbackName];
      } catch (e) {}

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      onSuccess(response);
    };


  const query =
    new URLSearchParams({
      ...params,
      callback: callbackName,
      _ts: Date.now().toString()
    });


  script.src =
    WEB_APP_URL +
    "?" +
    query.toString();


  script.onerror =
    function() {

      if (finished) {
        return;
      }

      finished = true;

      clearTimeout(timer);

      try {
        delete window[callbackName];
      } catch (e) {}

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      onError(
        "Tidak dapat terhubung ke database."
      );
    };


  document.body.appendChild(script);
}


/*
========================================
DISPLAY BOX
========================================
*/

function setBox(
  id,
  className,
  content
) {

  const element =
    document.getElementById(id);

  element.className =
    className;

  element.innerHTML =
    content;

  element.style.display =
    "block";
}


/*
========================================
ESCAPE HTML
========================================
*/

function escapeHtml(text) {

  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/*
========================================
BUTTON: SCAN NEXT PARTICIPANT
========================================
*/

function showContinueButton() {

  const result =
    document.getElementById(
      "result"
    );

  const button =
    document.createElement(
      "button"
    );

  button.type =
    "button";

  button.className =
    "next-button";

  button.innerText =
    "OK - Scan Next Participant";

  button.onclick =
    function() {

      resetScanner();

    };


  result.appendChild(
    button
  );
}


/*
========================================
QR SCAN
========================================
*/

function onScanSuccess(
  decodedText
) {

  if (scanLocked) {
    return;
  }


  scanLocked = true;


  setBox(
    "result",
    "processing",

    "<div class='status-title'>" +
    "Checking..." +
    "</div>" +

    "<p>" +
    "QR Code sedang diverifikasi." +
    "</p>"
  );


  const location =
    document
      .getElementById(
        "scannerLocation"
      )
      .value;


  jsonpRequest(

    {
      action: "checkin",
      token: decodedText.trim(),
      location: location
    },

    function(response) {

      showResult(
        response
      );

    },

    function(message) {

      setBox(
        "result",
        "invalid",

        "<div class='status-title'>" +
        "❌ CONNECTION ERROR" +
        "</div>" +

        "<p>" +
        escapeHtml(message) +
        "</p>"
      );

      showContinueButton();

    }

  );

}


/*
========================================
SHOW RESULT
========================================
*/

function showResult(
  response
) {

  if (!response) {

    setBox(
      "result",
      "invalid",

      "<div class='status-title'>" +
      "❌ ERROR" +
      "</div>" +

      "<p>" +
      "No response from database." +
      "</p>"
    );

    showContinueButton();

    return;
  }


  /*
  ========================================
  CHECK-IN SUCCESS
  ========================================
  */

  if (
    response.type ===
    "success"
  ) {

    setBox(
      "result",
      "success",

      "<div class='status-title'>" +
      "✅ CHECK-IN SUCCESS" +
      "</div>" +

      "<h2>" +
      escapeHtml(
        response.name
      ) +
      "</h2>" +

      "<p>" +
      escapeHtml(
        response.institution
      ) +
      "</p>" +

      "<p>" +
      "Payment Status:<br>" +

      "<strong>" +
      escapeHtml(
        response.paymentStatus
      ) +
      "</strong>" +

      "</p>" +

      "<p>" +
      "Location:<br>" +

      "<strong>" +
      escapeHtml(
        response.location
      ) +
      "</strong>" +

      "</p>"
    );

    showContinueButton();

  }


  /*
  ========================================
  ALREADY CHECKED-IN
  ========================================
  */

  else if (
    response.type ===
    "duplicate"
  ) {

    setBox(
      "result",
      "duplicate",

      "<div class='status-title'>" +
      "⚠️ ALREADY CHECKED IN" +
      "</div>" +

      "<h2>" +
      escapeHtml(
        response.name
      ) +
      "</h2>" +

      "<p>" +
      escapeHtml(
        response.institution
      ) +
      "</p>" +

      "<p>" +
      "Previous Check-in:<br>" +

      "<strong>" +
      escapeHtml(
        response.checkInTime
      ) +
      "</strong>" +

      "</p>"
    );

    showContinueButton();

  }


  /*
  ========================================
  CASH ONSITE
  ========================================
  */

  else if (
    response.type ===
    "cash"
  ) {

    setBox(
      "result",
      "cash",

      "<div class='status-title'>" +
      "⚠️ CASH ONSITE" +
      "</div>" +

      "<h2>" +
      escapeHtml(
        response.name
      ) +
      "</h2>" +

      "<p>" +
      escapeHtml(
        response.institution
      ) +
      "</p>" +

      "<p>" +
      "Please proceed to the " +

      "<strong>" +
      "Registration Desk" +
      "</strong>" +

      " for payment verification." +

      "</p>"
    );

    showContinueButton();

  }


  /*
  ========================================
  PAYMENT NOT VERIFIED
  ========================================
  */

  else if (
    response.type ===
    "payment"
  ) {

    setBox(
      "result",
      "payment",

      "<div class='status-title'>" +
      "❌ PAYMENT NOT VERIFIED" +
      "</div>" +

      "<h2>" +
      escapeHtml(
        response.name
      ) +
      "</h2>" +

      "<p>" +
      escapeHtml(
        response.institution
      ) +
      "</p>" +

      "<p>" +
      "Payment Status:<br>" +

      "<strong>" +
      escapeHtml(
        response.paymentStatus
      ) +
      "</strong>" +

      "</p>" +

      "<p>" +
      "Please contact the Registration Desk." +
      "</p>"
    );

    showContinueButton();

  }


  /*
  ========================================
  INVALID QR
  ========================================
  */

  else if (
    response.type ===
    "invalid"
  ) {

    setBox(
      "result",
      "invalid",

      "<div class='status-title'>" +
      "❌ INVALID QR CODE" +
      "</div>" +

      "<p>" +
      escapeHtml(
        response.message ||
        "Participant not found."
      ) +
      "</p>"
    );

    showContinueButton();

  }


  /*
  ========================================
  SYSTEM ERROR
  ========================================
  */

  else {

    setBox(
      "result",
      "invalid",

      "<div class='status-title'>" +
      "❌ SYSTEM ERROR" +
      "</div>" +

      "<p>" +
      escapeHtml(
        response.message ||
        "Unknown error."
      ) +
      "</p>"
    );

    showContinueButton();

  }

}


/*
========================================
RESET SCANNER
========================================
*/

function resetScanner() {

  const result =
    document.getElementById(
      "result"
    );

  result.style.display =
    "none";

  result.innerHTML =
    "";

  scanLocked =
    false;
}


/*
========================================
START QR SCANNER
========================================
*/

const scanner =
  new Html5QrcodeScanner(

    "reader",

    {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      rememberLastUsedCamera:
        true,

      showTorchButtonIfSupported:
        true,

      showZoomSliderIfSupported:
        true

    },

    false

  );


scanner.render(
  onScanSuccess
);

</script>

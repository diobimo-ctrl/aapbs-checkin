```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AAPBS 2026 Check-in</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
body {
  margin: 0;
  background: #f3f5f7;
  font-family: Arial, sans-serif;
  color: #1f2937;
}

.container {
  max-width: 650px;
  margin: 24px auto;
  padding: 16px;
}

.card {
  background: #ffffff;
  padding: 24px;
  border-radius: 18px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.10);
}

h1 {
  text-align: center;
  margin: 0 0 6px;
  font-size: 28px;
}

.subtitle {
  text-align: center;
  color: #6b7280;
  font-size: 18px;
  margin-bottom: 22px;
}

label {
  font-weight: 700;
}

select {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  margin: 9px 0 18px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 16px;
}

#reader {
  width: 100%;
}

#result {
  display: none;
  margin-top: 18px;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
}

.success {
  background: #d4edda;
  color: #155724;
}

.duplicate {
  background: #fff3cd;
  color: #856404;
}

.payment {
  background: #f8d7da;
  color: #721c24;
}

.cash {
  background: #fff3cd;
  color: #856404;
}

.invalid {
  background: #f8d7da;
  color: #721c24;
}

.processing {
  background: #d9edf7;
  color: #0c5460;
}

.hint {
  font-size: 13px;
  color: #6b7280;
  text-align: center;
  margin-top: 14px;
}

.status-title {
  font-size: 24px;
  margin-bottom: 10px;
}
</style>

</head>

<body>

<div class="container">

  <div class="card">

    <h1>AAPBS Annual Meeting 2026</h1>

    <div class="subtitle">
      Participant Check-in
    </div>

    <label for="scannerLocation">
      Scanner Location
    </label>

    <select id="scannerLocation">
      <option value="Main Entrance">Main Entrance</option>
      <option value="Registration Desk">Registration Desk</option>
      <option value="Ballroom Entrance">Ballroom Entrance</option>
      <option value="Seminar Room">Seminar Room</option>
    </select>

    <div id="reader"></div>

    <div id="result"></div>

    <div class="hint">
      Please allow camera access when requested.
      You may also use “Scan an Image File” for testing.
    </div>

  </div>

</div>


<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbyOwTh_jI1WQ0EgpJ5ouz_leRguV47yHGLgWbeImkrtVuIZV1tcAKQBI7WPNPjuU-df2A/exec";


let scanLocked = false;
let jsonpCounter = 0;


function jsonpRequest(params, onSuccess, onError) {

  jsonpCounter++;

  const callbackName =
    "aapbsCallback_" +
    Date.now() +
    "_" +
    jsonpCounter;

  const script =
    document.createElement("script");

  let finished = false;

  const timer =
    setTimeout(function() {

      if (finished) return;

      finished = true;

      try {
        delete window[callbackName];
      } catch (e) {}

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      onError(
        "Database tidak merespons. Silakan coba kembali."
      );

    }, 15000);


  window[callbackName] =
    function(response) {

      if (finished) return;

      finished = true;

      clearTimeout(timer);

      try {
        delete window[callbackName];
      } catch (e) {}

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      onSuccess(response);
    };


  const query =
    new URLSearchParams({
      ...params,
      callback: callbackName,
      _ts: Date.now().toString()
    });


  script.src =
    WEB_APP_URL +
    "?" +
    query.toString();


  script.onerror =
    function() {

      if (finished) return;

      finished = true;

      clearTimeout(timer);

      try {
        delete window[callbackName];
      } catch (e) {}

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      onError(
        "Tidak dapat terhubung ke database."
      );
    };


  document.body.appendChild(script);
}


function setBox(id, className, content) {

  const element =
    document.getElementById(id);

  element.className =
    className;

  element.innerHTML =
    content;

  element.style.display =
    "block";
}


function escapeHtml(text) {

  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function onScanSuccess(decodedText) {

  if (scanLocked) {
    return;
  }

  scanLocked = true;


  setBox(
    "result",
    "processing",
    "<div class='status-title'>Checking...</div>" +
    "<p>QR Code sedang diverifikasi.</p>"
  );


  const location =
    document
      .getElementById(
        "scannerLocation"
      )
      .value;


  jsonpRequest(

    {
      action: "checkin",
      token: decodedText.trim(),
      location: location
    },

    function(response) {

      showResult(response);

    },

    function(message) {

      setBox(
        "result",
        "invalid",
        "<div class='status-title'>❌ CONNECTION ERROR</div>" +
        "<p>" +
        escapeHtml(message) +
        "</p>"
      );

      setTimeout(
        resetScanner,
        5000
      );

    }

  );

}


function showResult(response) {

  if (!response) {

    setBox(
      "result",
      "invalid",
      "<div class='status-title'>❌ ERROR</div>" +
      "<p>No response from database.</p>"
    );

    setTimeout(
      resetScanner,
      4000
    );

    return;
  }


  if (response.type === "success") {

    setBox(
      "result",
      "success",

      "<div class='status-title'>✅ CHECK-IN SUCCESS</div>" +

      "<h2>" +
      escapeHtml(response.name) +
      "</h2>" +

      "<p>" +
      escapeHtml(
        response.institution
      ) +
      "</p>" +

      "<p>Payment Status:<br>" +
      "<strong>" +
      escapeHtml(
        response.paymentStatus
      ) +
      "</strong></p>" +

      "<p>Location:<br>" +
      "<strong>" +
      escapeHtml(
        response.location
      ) +
      "</strong></p>"

    );

  }


  else if (
    response.type ===
    "duplicate"
  ) {

    setBox(
      "result",
      "duplicate",

      "<div class='status-title'>⚠️ ALREADY CHECKED IN</div>" +

      "<h2>" +
      escapeHtml(
        response.name
      ) +
      "</h2>" +

      "<p>" +
      escapeHtml(
        response.institution
      ) +
      "</p>" +

      "<p>Previous Check-in:<br>" +

      "<strong>" +
      escapeHtml(
        response.checkInTime
      ) +
      "</strong></p>"

    );

  }


  else if (
    response.type ===
    "cash"
  ) {

    setBox(
      "result",
      "cash",

      "<div class='status-title'>⚠️ CASH ONSITE</div>" +

      "<h2>" +
      escapeHtml(
        response.name
      ) +
      "</h2>" +

      "<p>" +
      escapeHtml(
        response.institution
      ) +
      "</p>" +

      "<p>Please proceed to the " +

      "<strong>Registration Desk</strong>" +

      " for payment verification.</p>"

    );

  }


  else if (
    response.type ===
    "payment"
  ) {

    setBox(
      "result",
      "payment",

      "<div class='status-title'>❌ PAYMENT NOT VERIFIED</div>" +

      "<h2>" +
      escapeHtml(
        response.name
      ) +
      "</h2>" +

      "<p>" +
      escapeHtml(
        response.institution
      ) +
      "</p>" +

      "<p>Payment Status:<br>" +

      "<strong>" +
      escapeHtml(
        response.paymentStatus
      ) +
      "</strong></p>" +

      "<p>Please contact the Registration Desk.</p>"

    );

  }


  else if (
    response.type ===
    "invalid"
  ) {

    setBox(
      "result",
      "invalid",

      "<div class='status-title'>❌ INVALID QR CODE</div>" +

      "<p>" +
      escapeHtml(
        response.message ||
        "Participant tidak ditemukan."
      ) +
      "</p>"

    );

  }


  else {

    setBox(
      "result",
      "invalid",

      "<div class='status-title'>❌ SYSTEM ERROR</div>" +

      "<p>" +
      escapeHtml(
        response.message ||
        "Unknown error."
      ) +
      "</p>"

    );

  }


  setTimeout(
    resetScanner,
    5000
  );

}


function resetScanner() {

  document
    .getElementById(
      "result"
    )
    .style
    .display =
    "none";

  scanLocked =
    false;
}


const scanner =
  new Html5QrcodeScanner(

    "reader",

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      rememberLastUsedCamera:
        true,

      showTorchButtonIfSupported:
        true,

      showZoomSliderIfSupported:
        true
    },

    false

  );


scanner.render(
  onScanSuccess
);

</script>

</body>
</html>
